# Build the FastAPI dashboard (main.py) as a Docker image and publish it to
# GitHub Container Registry (GHCR) on every push to main.
#
# Why not GitHub Pages: Pages only serves static files — it cannot run the
# FastAPI backend or scrapers. This workflow produces an image you can run on
# ANY host (Render, Railway, Fly.io, a VPS) to get the same behavior as
# `uvicorn main:app` on localhost:8000.
#
# To get a live URL with zero extra config, connect this repo to Render once
# (dashboard) — render.yaml auto-deploys on every push. No workflow needed for
# that path; this workflow mirrors the same image to GHCR as a backup/portable
# artifact.

name: Build + Publish Dashboard Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "docker"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Image published: ghcr.io/${{ github.repository }}:latest"
          echo "Run it anywhere with:"
          echo "  docker pull ghcr.io/${{ github.repository }}:latest"
          echo "  docker run -p 8000:8000 ghcr.io/${{ github.repository }}:latest"
